pid /tmp/nginx.pid;
events {}
http {
 log_format safe '$remote_addr "$request_method $uri" $status';
 access_log /dev/stdout safe; error_log /dev/stderr warn;
 client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server { listen 8080; client_max_body_size 1g; client_body_timeout 600s;
 location ~ ^/(browser|cool|hosting|lool) { proxy_pass http://collabora:9980; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s; proxy_buffering off; }
 location = /auth { return 404; }
 location = /_convert_auth { internal; proxy_pass http://127.0.0.1:8000/auth; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Authorization $http_authorization; proxy_set_header Cookie $http_cookie; }
 location /convert/ { client_max_body_size 201m; auth_request /_convert_auth; proxy_pass http://libreoffice:3000/; proxy_set_header Host $http_host; proxy_request_buffering off; proxy_read_timeout 600s; }
 location / { proxy_request_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_pass http://127.0.0.1:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
 }
}
